    <text x="1192" y="528" class="card-bullet"><tspan class="card-bullet-bold">• 入口①②③</tspan> 各校验失败后果占位</text>
    <text x="1192" y="554" class="card-bullet"><tspan class="card-bullet-bold">• 性质</tspan> 一次性列出缺失项占位</text>
