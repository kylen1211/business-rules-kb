<!-- sum-svg-diagram · flow master(业务流程图骨架母版)· v2.0.0 -->
<!-- 铁律:浅色底 + 泳道横带纵向堆叠(圆角虚线彩色容器 + 左上角彩色标签芯片)+ 泳道内步骤卡片自左向右横排(头部编号来源芯片 + 粗标题 + bullet 要点行,判定语义写进 bullets,不用菱形)+ 拒绝出口为玫红卡片放在所属泳道右端 + 连线三类语义(主链路蓝实线 / 校验链橙实线 / 拒绝路径红虚线)+ 药丸标签标注连线结果或衔接说明 + 跨泳道衔接用带药丸标签的折线 + 底部 💡 核心提示行与横排图例 + 绘制层序背景→容器→连线→卡片→文字→药丸→图例,均不可改;可调:泳道数 / 每道卡片数 / 连线数 / 画布尺寸随内容线性伸缩,全部占位文字须替换为真实内容 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1030" width="100%" height="100%" text-rendering="geometricPrecision" shape-rendering="geometricPrecision">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="badge-shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EA580C"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#E11D48"/>
    </marker>
  </defs>

  <style>
    text {
      font-family: 'Noto Sans CJK SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .header-title { font-size: 28px; font-weight: 800; fill: #0F172A; letter-spacing: -0.5px; }
    .header-sub { font-size: 14.5px; font-weight: 500; fill: #64748B; }
    .layer-tag { font-size: 12.5px; font-weight: 700; }
    .card-title { font-size: 16px; font-weight: 700; fill: #0F172A; }
    .card-tag-text { font-size: 11px; font-weight: 700; }
    .card-bullet { font-size: 13px; font-weight: 400; fill: #334155; }
    .card-bullet-bold { font-weight: 600; fill: #0F172A; }
    .pill-text { font-size: 10.5px; font-weight: 600; }
    .corridor-pill-text { font-size: 11.5px; font-weight: 800; fill: #1E40AF; }
  </style>
  <rect x="0" y="0" width="1600" height="1030" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="45" y="55" class="header-title">「业务名」· 完整业务流程(占位标题)</text>
  <text x="45" y="85" class="header-sub">链路A 阶段名占位 + 链路B 阶段名占位 + 链路C 阶段名占位 · 事实源「路径占位」· 基线「commit占位」</text>
  <rect x="1330" y="33" width="225" height="38" rx="19" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <circle cx="1348" cy="52" r="5" fill="#10B981"/>
  <text x="1362" y="57" font-size="13" font-weight="700" fill="#1E40AF">「模块名」v1(占位)</text>

  <!-- ============ Lane containers ============ -->
  <rect x="30" y="110" width="1540" height="250" rx="16" fill="#F8FAFC" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="45" y="123" width="460" height="26" rx="6" fill="#DBEAFE"/>
  <text x="55" y="141" class="layer-tag" fill="#1E40AF">泳道1 · 链路A 名称(触发时机 · 执行频次占位)</text>

  <rect x="30" y="400" width="1540" height="230" rx="16" fill="#FAF5FF" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="45" y="413" width="460" height="26" rx="6" fill="#F3E8FF"/>
  <text x="55" y="431" class="layer-tag" fill="#6B21A8">泳道2 · 链路B 名称(校验链 · 执行时机占位)</text>

  <rect x="30" y="670" width="1540" height="230" rx="16" fill="#F0FDF4" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="45" y="683" width="400" height="26" rx="6" fill="#DCFCE7"/>
  <text x="55" y="701" class="layer-tag" fill="#166534">泳道3 · 链路C 名称(装配与产出 · 占位)</text>

  <!-- ============ Connectors ============ -->
  <!-- Lane 1 -->
