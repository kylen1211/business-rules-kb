    <text x="1172" y="238" class="card-bullet"><tspan class="card-bullet-bold">• 触发来源</tspan> 来源占位</text>
    <text x="1172" y="264" class="card-bullet"><tspan class="card-bullet-bold">• 后果</tspan> 后果说明占位</text>
    <text x="1172" y="290" class="card-bullet"><tspan class="card-bullet-bold">• 性质</tspan> 性质说明占位</text>
