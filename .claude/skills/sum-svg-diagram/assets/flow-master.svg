  <path d="M 990,247.5 L 1160,247.5" stroke="#E11D48" stroke-width="2.5" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow-rose)"/>

  <!-- Cross-lane corridor 1 -> 2 -->
  <path d="M 800,335 L 800,380 L 190,380 L 190,450" stroke="#2563EB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>

  <!-- Lane 2 -->
  <path d="M 320,537.5 L 450,537.5" stroke="#EA580C" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/>
  <path d="M 710,537.5 L 800,537.5" stroke="#EA580C" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/>
  <path d="M 1060,537.5 L 1180,537.5" stroke="#E11D48" stroke-width="2.5" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow-rose)"/>

  <!-- Cross-lane corridor 2 -> 3 -->
  <path d="M 930,600 L 930,650 L 460,650 L 460,720" stroke="#2563EB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>

  <!-- Lane 3 -->
  <path d="M 650,795 L 780,795" stroke="#2563EB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M 1160,795 L 1270,795" stroke="#2563EB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>

