<!-- 铁律:分层带/竖排层名/组件卡片构造(标签芯片+粗标题+子能力小格)/连线语义(实线同步·虚线异步·双端双向)/药丸标签/摘要面板/图例不可改;可调:层数/组件数/小格数/连线数/画布尺寸随内容线性伸缩,全部占位文字须替换为真实内容 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1330" width="1500" height="1330">
<defs>
<filter id="pillShadow" x="-50%" y="-50%" width="200%" height="200%">
