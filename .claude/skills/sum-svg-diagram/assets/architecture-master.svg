  <polygon points="9 0, 0 4, 9 8" fill="#059669"/>
</marker>
<marker id="arr-o-end" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
  <polygon points="0 0, 9 4, 0 8" fill="#EA580C"/>
</marker>
<marker id="arr-o-start" markerWidth="9" markerHeight="8" refX="1" refY="4" orient="auto">
  <polygon points="9 0, 0 4, 9 8" fill="#EA580C"/>
</marker>
</defs>
